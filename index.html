<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:#0B0A0D;color:#F2EDEF;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;left:50%;top:-180px;width:520px;height:420px;
  transform:translateX(-50%);pointer-events:none;z-index:0;
  background:radial-gradient(closest-side,rgba(142,27,79,.42),rgba(142,27,79,0));
}
button,input,textarea{font-family:inherit;font-size:16px;color:inherit}
button{border:0;background:none;cursor:pointer}
h1,h2,h3{margin:0;line-height:1.15;font-weight:800;letter-spacing:-.5px}
p{margin:0 0 10px}
p:last-child{margin-bottom:0}
.oculto{display:none !important}

#app{position:relative;z-index:1;max-width:430px;margin:0 auto;
  padding:calc(14px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom))}

/* ── marca ────────────────────────────────────────────────────── */
#marca{display:flex;align-items:center;gap:9px;margin-bottom:22px}
#marca .pt{width:9px;height:9px;border-radius:99px;background:#E84C8A;
  box-shadow:0 0 12px rgba(232,76,138,.9)}
#marca b{font-size:13px;letter-spacing:2.6px;text-transform:uppercase;
  font-weight:700;color:rgba(242,237,239,.62)}

/* ── racha grande ─────────────────────────────────────────────── */
#racha{text-align:center;padding:6px 0 26px}
#racha .fuego{font-size:44px;line-height:1;filter:drop-shadow(0 0 18px rgba(232,76,138,.45))}
#racha .num{font-size:96px;font-weight:850;letter-spacing:-6px;line-height:.92;
  margin:6px 0 0;background:linear-gradient(180deg,#fff 20%,#E84C8A 130%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
#racha .dias{font-size:19px;font-weight:700;letter-spacing:-.2px;margin-top:2px}
#racha .desde{font-size:13.5px;color:rgba(242,237,239,.5);margin-top:7px}
#racha .estado{display:inline-block;margin-top:13px;font-size:12.5px;font-weight:700;
  letter-spacing:.4px;padding:7px 14px;border-radius:99px;
  background:rgba(232,76,138,.14);color:#F09CC0;border:1px solid rgba(232,76,138,.28)}
#racha .estado.riesgo{background:rgba(214,142,26,.16);color:#F0C067;border-color:rgba(214,142,26,.36)}
#racha .estado.nueva{background:rgba(255,255,255,.07);color:rgba(242,237,239,.72);border-color:rgba(255,255,255,.13)}

/* ── tarjetas ─────────────────────────────────────────────────── */
.card{background:#141118;border:1px solid rgba(255,255,255,.075);
  border-radius:24px;padding:22px;margin-bottom:14px}
.card.hero{background:linear-gradient(165deg,#2A0E1D 0%,#160A11 62%);
  border-color:rgba(232,76,138,.30);box-shadow:0 18px 46px rgba(0,0,0,.55)}
.eti{font-size:11.5px;font-weight:800;letter-spacing:2.2px;text-transform:uppercase;
  color:#E84C8A;margin:0 0 12px}
.eti.gris{color:rgba(242,237,239,.42)}
.preg{font-size:25px;font-weight:750;letter-spacing:-.7px;line-height:1.24;margin:0}
.mini{font-size:13.5px;color:rgba(242,237,239,.55);line-height:1.55}

/* ── botones ──────────────────────────────────────────────────── */
.bt{display:block;width:100%;border-radius:99px;padding:17px;font-size:16.5px;
  font-weight:750;letter-spacing:-.2px;background:#8E1B4F;color:#fff;
  box-shadow:0 10px 26px rgba(142,27,79,.42);margin-top:18px}
.bt:active{transform:translateY(1px)}
.bt.suave{background:rgba(255,255,255,.075);color:#F2EDEF;box-shadow:none;
  border:1px solid rgba(255,255,255,.11)}
.bt.chico{padding:13px;font-size:14.5px;margin-top:10px}
.bt[disabled]{opacity:.35;box-shadow:none}
.fila{display:flex;gap:10px}
.fila .bt{margin-top:14px}

/* ── mazos ────────────────────────────────────────────────────── */
.mazo{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:#141118;border:1px solid rgba(255,255,255,.075);
  border-radius:22px;padding:18px;margin-bottom:12px}
.mazo .em{font-size:30px;flex:0 0 auto}
.mazo b{display:block;font-size:18px;font-weight:780;letter-spacing:-.3px}
.mazo small{display:block;font-size:13px;color:rgba(242,237,239,.5);margin-top:3px}
.mazo .fl{margin-left:auto;color:rgba(242,237,239,.35);font-size:20px}
.candado{font-size:11px;font-weight:800;letter-spacing:.8px;color:#F0C067;
  background:rgba(214,142,26,.14);border-radius:99px;padding:3px 9px;margin-left:8px}

/* ── escribir ─────────────────────────────────────────────────── */
textarea{width:100%;min-height:150px;border-radius:20px;padding:17px;
  background:#0F0D12;border:1px solid rgba(255,255,255,.12);
  resize:none;line-height:1.55;font-size:16.5px;outline:none}
textarea:focus{border-color:rgba(232,76,138,.55)}
input[type=text]{width:100%;border-radius:16px;padding:15px 16px;background:#0F0D12;
  border:1px solid rgba(255,255,255,.12);outline:none}
input[type=text]:focus{border-color:rgba(232,76,138,.55)}
label.campo{display:block;font-size:12.5px;font-weight:700;letter-spacing:1.2px;
  text-transform:uppercase;color:rgba(242,237,239,.45);margin:0 0 7px}
.campo-wrap{margin-bottom:16px}

/* ── el pase de celular ───────────────────────────────────────── */
.pase{text-align:center;padding:46px 10px 30px}
.pase .ico{font-size:56px}
.pase h2{font-size:29px;margin:18px 0 10px}
.pase p{font-size:15.5px;color:rgba(242,237,239,.58);max-width:19rem;margin:0 auto}

/* ── revelacion ───────────────────────────────────────────────── */
.resp{background:#141118;border:1px solid rgba(255,255,255,.08);
  border-radius:22px;padding:19px;margin-bottom:12px;
  animation:aparece .5s cubic-bezier(.16,1,.3,1) both}
.resp:nth-child(2){animation-delay:.22s}
.resp .quien{font-size:12px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;
  color:#E84C8A;margin-bottom:9px}
.resp .txt{font-size:18px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
@keyframes aparece{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.subio{text-align:center;margin:22px 0 4px;animation:aparece .5s .5s both}
.subio .f{font-size:38px}
.subio b{display:block;font-size:22px;margin-top:6px}
.subio small{display:block;font-size:13.5px;color:rgba(242,237,239,.5);margin-top:5px}

/* ── historial ────────────────────────────────────────────────── */
.dia{background:#141118;border:1px solid rgba(255,255,255,.075);
  border-radius:20px;padding:17px 18px;margin-bottom:11px}
.dia .fecha{font-size:11.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;
  color:rgba(242,237,239,.4);margin-bottom:8px}
.dia .q{font-size:16.5px;font-weight:720;letter-spacing:-.3px;line-height:1.3}
.dia .cuerpo{margin-top:13px;padding-top:13px;border-top:1px solid rgba(255,255,255,.07)}
.dia .cuerpo .quien{font-size:11.5px;font-weight:800;letter-spacing:1.4px;
  text-transform:uppercase;color:#E84C8A;margin-bottom:4px}
.dia .cuerpo .txt{font-size:15px;line-height:1.5;color:rgba(242,237,239,.85);
  white-space:pre-wrap;word-break:break-word;margin-bottom:12px}
.dia .cuerpo .txt:last-child{margin-bottom:0}
.vacio{text-align:center;padding:52px 20px;color:rgba(242,237,239,.42);font-size:15px}

/* ── codigo de respaldo ───────────────────────────────────────── */
.codigo{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:19px;font-weight:700;letter-spacing:.4px;text-align:center;
  background:#0F0D12;border:1px dashed rgba(232,76,138,.45);border-radius:18px;
  padding:20px 8px;margin:4px 0 8px;white-space:nowrap;overflow-x:auto;color:#F09CC0}
.aviso{display:flex;gap:11px;align-items:flex-start;background:rgba(214,142,26,.10);
  border:1px solid rgba(214,142,26,.28);border-radius:18px;padding:15px 16px;margin-bottom:14px}
.aviso .i{font-size:18px;line-height:1.3}
.aviso p{font-size:13.5px;line-height:1.55;color:#EAD3A8}
.ok-msg{background:rgba(60,180,110,.12);border:1px solid rgba(60,180,110,.32);
  color:#9BE3BC;border-radius:16px;padding:13px 15px;font-size:14px;margin-top:12px}
.mal-msg{background:rgba(200,60,60,.12);border:1px solid rgba(200,60,60,.32);
  color:#F0A7A7;border-radius:16px;padding:13px 15px;font-size:14px;margin-top:12px}

/* ── barra de volver ──────────────────────────────────────────── */
.volver{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:650;
  color:rgba(242,237,239,.55);padding:4px 0 20px}
.pie{margin-top:26px;text-align:center}
.pie button{font-size:13.5px;color:rgba(242,237,239,.42);padding:9px;font-weight:600}
.sep{height:1px;background:rgba(255,255,255,.07);margin:26px 0 20px}

},{"nombre":"NUESTRA HISTORIA","cartas":["¿Cuál fue el momento en que decidiste quedarte, aunque pudiste irte?","¿Qué día sentiste que pasamos de \"esto es bonito\" a \"esto es serio\"?","¿Qué te hizo confiar en mí por primera vez de verdad?","¿Cuándo fue la vez que más cerca estuvimos de rompernos, y qué nos salvó?","¿Qué versión mía extrañas del pasado y cuál prefieres de ahora?","¿Qué aprendiste de ti mismo/a estando conmigo que no sabías?","¿Qué cambió en tu idea del amor desde que empezamos?","Si nuestra historia fuera un libro, ¿qué título le pondrías a este capítulo?"]},{"nombre":"LOS PEQUEÑOS DETALLES","cartas":["¿Qué hago cuando estoy nervioso/a que ya aprendiste a reconocer?","¿Cómo te das cuenta de que tuve un mal día antes de que lo diga?","¿Qué manía mía te molestaba al principio y ahora te da ternura?","¿Qué gesto mínimo mío te derrite cada vez?","¿Qué detalle tuyo crees que solo yo cuido?","¿Qué cosa hago sin darme cuenta que dice mucho de cuánto te quiero?","¿En qué se nota, para ti, que envejecemos juntos con cariño?"]},{"nombre":"CUANDO EL MUNDO APRIETA","cartas":["¿Cómo te gustaría que te sostenga cuando todo te sale mal?","¿Qué te calma de mí en medio de una crisis?","¿Qué carga tuya te gustaría poder soltar en mí sin sentir culpa?","¿Cuándo sentiste que fui tu refugio, y cuándo te faltó?","¿Qué necesitas de mí cuando estás al límite: acción, silencio o abrazo?","¿Qué miedo tuyo se hace más chico cuando estoy cerca?"]},{"nombre":"FAMILIA Y RAÍCES","cartas":["¿Qué de cómo te criaron quieres repetir con nosotros, y qué no?","¿Qué herida de tu familia te gustaría no arrastrar a lo nuestro?","¿A quién de tu familia te gustaría que yo entendiera mejor?","¿Qué costumbre de tu casa de niño/a te gustaría que hagamos nuestra?","¿Qué te enseñó tu familia sobre el amor que hoy revisas?","¿Qué te gustaría que digan de nosotros los que nos conocen?"]},{"nombre":"CRECER JUNTOS","cartas":["¿En qué quieres convertirte, y cómo puedo ayudarte sin empujarte?","¿Qué sueño tuyo pusiste en pausa por miedo o por tiempo?","¿En qué crees que yo te hago mejor persona?","¿En qué te gustaría que yo creciera por nosotros?","¿Qué te gustaría aprender o intentar juntos este año?","¿Qué logro tuyo te gustaría que celebre más de lo que lo hago?"]},{"nombre":"CONFIANZA Y SEGURIDAD","cartas":["¿Qué te hace sentir totalmente seguro/a de mí?","¿Qué necesitas para no dudar cuando estamos lejos?","¿Qué gesto mío reconstruye tu confianza cuando algo la sacude?","¿Hay algo que necesites saber de mí para estar en paz?","¿Qué acuerdo nuestro te da tranquilidad, y cuál te gustaría revisar?","¿Cómo te gustaría que actúe cuando alguien intenta meterse entre nosotros?"]},{"nombre":"SENTIDO Y VALORES","cartas":["¿Qué le da sentido a tu vida hoy, además de mí?","¿En qué crees, aunque cueste explicarlo?","¿Qué valor tuyo no negociarías jamás, ni por amor?","¿Qué te gustaría que dejáramos como huella en el mundo, juntos?","¿Qué te da paz cuando piensas en la vida y en la muerte?","¿Qué crees que la vida quiso enseñarte al ponerte a mi lado?"]},{"nombre":"HIPOTÉTICAS QUE REVELAN","cartas":["Si solo pudieras conservar tres recuerdos nuestros, ¿cuáles salvarías?","Si yo perdiera la memoria, ¿qué de nosotros me contarías primero?","Si tuvieras un día entero sin obligaciones y solo conmigo, ¿cómo sería?","Si pudieras mandarte un mensaje al día que nos conocimos, ¿qué te dirías?","Si nuestra relación necesitara una sola cosa para durar toda la vida, ¿cuál sería?","Si pudieras sentir por un minuto lo que yo siento por ti, ¿qué crees que descubrirías?"]},{"nombre":"GRATITUD ESPECÍFICA","cartas":["¿Qué de mí agradeces hoy que hace un año no valorabas igual?","¿Qué renuncia mía por ti crees que no siempre reconoces?","¿Qué momento reciente te hizo pensar \"qué suerte tenerlo/a\"?","¿Por qué de mí no me has dado las gracias y deberías?","¿Qué parte de tu vida es mejor por mí, y no me lo has dicho?"]},{"nombre":"MEJORES AMIGOS","cartas":["¿En qué soy tu cómplice más que tu pareja?","¿Qué me contarías a mí antes que a nadie, sea bueno o malo?","¿Qué plan tonto y feliz harías solo conmigo?","¿De qué te ríes conmigo que con nadie más?","¿Qué te gusta hacer a mi lado sin necesidad de hablar?","¿Qué aventura pendiente te gustaría tachar juntos de la lista?","¿Qué te hace sentir que somos un equipo contra el mundo?"]},{"nombre":"EL CUERPO Y EL CUIDADO","cartas":["¿Qué contacto físico mío te reconforta más: la mano, el abrazo, la cabeza en tu hombro?","¿Cómo te gustaría que te cuide cuando estés enfermo/a?","¿Qué le tienes miedo a que le pase a tu cuerpo con los años, y cómo quieres que te acompañe?","¿Qué hábito sano te gustaría que empecemos juntos?","¿Qué parte de ti te cuesta querer, y cómo puedo ayudarte a mirarla distinto?","¿Qué gesto de cuidado mío te hace sentir amado/a sin palabras?"]},{"nombre":"DINERO, CASA Y PROYECTOS","cartas":["¿Qué aprendiste sobre el dinero de niño/a que hoy influye en nosotros?","¿Qué proyecto juntos te ilusiona más: viaje, casa, negocio, familia?","¿Qué te da seguridad y qué te da miedo cuando pensamos en el futuro económico?","¿Cómo te gustaría que tomemos las decisiones grandes de plata?","¿Qué lujo pequeño te gustaría darnos sin culpa?","Si tuviéramos que empezar de cero mañana, ¿confiarías en que salimos adelante juntos? ¿Por qué?"]},{"nombre":"RUTINA Y MAGIA","cartas":["¿Qué parte de nuestra rutina te gustaría convertir en un pequeño ritual?","¿Qué hacíamos al principio que deberíamos rescatar esta semana?","¿Qué día común contigo se te quedó grabado como especial?","¿Qué te haría sentir conquistado/a otra vez, aunque ya llevemos años?","¿Qué sorpresa pequeña te alegraría un martes cualquiera?","¿Qué momento del día es \"nuestro\" y no quieres perder?"]},{"nombre":"PERDONARNOS","cartas":["¿Qué te costó más perdonarte a ti mismo/a en esta relación?","¿Hay algo que necesites soltar para dejar de castigarnos por el pasado?","¿Qué palabra mía te sanaría si te la dijera hoy?","¿Qué aprendimos de nuestra peor pelea que hoy nos protege?","¿Qué te gustaría que hagamos distinto la próxima vez que uno se equivoque?"]},{"nombre":"LO QUE APRENDÍ DE TI","cartas":["¿Qué crees que aprendí de ti sin darme cuenta?","¿Qué me enseñaste sobre la paciencia, el amor o la vida?","¿En qué te gustaría parecerte más a mí, y en qué a ti?","¿Qué costumbre mía adoptaste como tuya?","¿Qué te gustaría que yo aprendiera de tu forma de ver la vida?"]},{"nombre":"CÁPSULA DEL TIEMPO","cartas":["¿Qué le dejarías escrito a nosotros dentro de cinco años?","¿Qué momento de hoy querrías recordar cuando seamos viejos?","¿Qué te gustaría que jamás cambie entre los dos?","¿Qué versión de nosotros te ilusiona más ser?","¿Qué promesa quieres hacerme hoy, en serio?"]},{"nombre":"SOLTAR Y REÍR","cartas":["¿Cuál es la tontería más grande por la que discutimos y hoy da risa?","¿Qué defecto mío ya aceptaste que no va a cambiar (y me quieres igual)?","¿Qué harías si por un día fuéramos el uno el otro?","¿Qué me perdonas siempre porque \"así soy yo\"?","¿Qué costumbre nuestra sería un chiste para los demás y un tesoro para nosotros?"]},{"nombre":"NECESIDADES CLARAS","cartas":["Completa: \"Me sentiría más amado/a si tú…\"","Completa: \"Me haría feliz que dejaras de…\"","Completa: \"Necesito que me digas más seguido que…\"","Completa: \"Cuando peleamos, lo que en realidad necesito es…\"","Completa: \"Lo que más miedo me da perder de nosotros es…\""]},{"nombre":"CONVIVENCIA","cartas":["¿Qué de vivir conmigo te gustó más de lo que esperabas?","¿Qué costumbre mía en casa te saca de quicio y ya aprendiste a querer?","¿Qué te hace sentir \"en casa\" cuando estás conmigo, más allá del lugar?","¿Qué tarea de la casa te gustaría que hiciéramos juntos por gusto, no por deber?","¿Qué espacio de la casa sientes más \"nuestro\"?","¿Qué necesitas para que compartir el día a día no apague la chispa?","¿Qué acuerdo de convivencia nos falta conversar con calma?"]},{"nombre":"VIAJES Y AVENTURAS","cartas":["¿A qué lugar te mueres por ir conmigo antes de viejos?","¿Qué recuerdo de un viaje o salida nuestra atesoras más?","¿Prefieres perderte conmigo sin plan o tener todo organizado? ¿Por qué?","¿Qué aventura te da miedo pero harías si voy contigo?","¿Qué descubriste de mí viajando que no se veía en la rutina?"]},{"nombre":"FAMILIA QUE FORMAMOS","cartas":["Cuando piensas en formar (o cuidar) una familia conmigo, ¿qué te ilusiona?","¿Qué te da miedo de esa etapa, y qué necesitarías de mí?","¿Qué clase de hogar quieres que sintamos, tengamos hijos o no?","¿Qué valor te gustaría que se respire en nuestra casa?","¿Qué de tu niñez querrías darle a quien venga (o a nosotros mismos)?"]},{"nombre":"ADMIRACIÓN","cartas":["¿Qué es lo que más admiras de cómo trato a los demás?","¿En qué momento te sentiste orgulloso/a de ser mi pareja?","¿Qué talento mío crees que no aprovecho lo suficiente?","¿Qué haría yo que te haría admirarme aún más?","¿Qué cualidad mía te gustaría que nunca pierda?"]},{"nombre":"DESEO EMOCIONAL","cartas":["¿Qué te falta de mí emocionalmente que no te has atrevido a nombrar?","¿Cuándo te sientes más conectado/a a mí, sin que nos toquemos?","¿Qué conversación conmigo te deja lleno/a por dentro?","¿Qué te gustaría que hiciéramos más para sentirnos íntimos sin intimidad física?","¿Qué te hace sentir que somos \"uno\" y no solo dos que se acompañan?"]},{"nombre":"ELIGE","cartas":["¿Una noche de charla profunda o un día entero de risas? ¿Por qué?","¿Que te lea la mente o que te pregunte siempre? ¿Por qué?","¿Que te sorprenda o que planeemos todo juntos?","¿Palabras o gestos? ¿Cuál te llega más de mí?","¿Prefieres que te defienda o que te dé la razón cuando estás mal?","¿Rutina segura o aventura incierta, conmigo?"]},{"nombre":"RECONCILIACIÓN","cartas":["¿Cómo sabes que ya te perdoné de verdad?","¿Qué necesitas después de una pelea para volver a sentirte cerca?","¿Qué frase mía te desarma el enojo?","¿Prefieres resolver en el momento o darnos aire primero?","¿Qué te gustaría que yo entienda de cómo te enojas?"]},{"nombre":"EL FUTURO NUESTRO","cartas":["¿Cómo quieres que sea un domingo cualquiera dentro de veinte años?","¿Qué te gustaría que sigamos haciendo cuando ya nadie nos mire?","¿Qué sueño compartido te haría sentir que \"lo logramos\"?","¿Qué te gustaría que yo recuerde de ti si un día no estás?","¿Qué quieres construir conmigo que dure más que nosotros?"]},{"nombre":"AGRADECER Y CERRAR","cartas":["¿Con qué frase resumirías lo que sientes por mí esta noche?","¿Qué te llevas de esta conversación que no sabías al empezar?","¿Qué te gustaría decirme antes de dormir hoy?","¿Qué haría que mañana sea un mejor día para los dos?","Si esta noche fuera un regalo, ¿qué parte te quedas para siempre?"]},{"nombre":"COMPLETA LA FRASE","cartas":["\"Contigo aprendí que el amor es…\"","\"La primera vez que sentí que eras mi hogar fue…\"","\"Lo que más me cuesta decirte es…\"","\"Cuando te miro dormir pienso en…\"","\"Si el mundo se acabara mañana, contigo querría…\"","\"Mi lugar favorito del mundo es… porque ahí estás tú cuando…\"","\"Nunca te lo dije, pero cada vez que tú… me enamoro otra vez.\"","\"Lo que más agradezco de habernos elegido es…\""]},{"nombre":"TRES PALABRAS","cartas":["Descríbeme en tres palabras… y explícame una.","Describe nuestra relación en tres palabras.","¿Qué tres palabras querrías que yo use para describirte?","Tres cosas que nunca quieres que cambien de nosotros.","Tres momentos nuestros que salvarías de un incendio."]},{"nombre":"YO NUNCA","cartas":["Yo nunca te dije lo nervioso/a que estaba en… (cuéntalo).","Yo nunca te confesé que guardo… (dime qué).","Yo nunca imaginé que contigo llegaría a… (completa).","Yo nunca me sentí tan yo mismo/a como cuando… (dime cuándo).","Yo nunca te agradecí de verdad por… (hazlo ahora)."]},{"nombre":"CUMPLEAÑOS Y FECHAS","cartas":["¿Qué regalo mío (no material) te llegó más al corazón?","¿Cómo te gustaría que celebre lo importante para ti?","¿Qué fecha nuestra querrías volver un ritual cada año?","¿Qué te haría sentir realmente visto/a en tu día?","¿Qué tradición de pareja te gustaría empezar este año?"]},{"nombre":"MICRO-MOMENTOS","cartas":["¿Qué gesto mínimo mío te alegra un día gris?","¿Qué sonido, olor o sabor te recuerda a mí?","¿Qué parte de despertar a mi lado te gusta más?","¿Qué momento del día piensas en mí sin querer?","¿Qué canción sientes que cuenta algo de nosotros?"]},{"nombre":"VULNERABILIDAD PROFUNDA","cartas":["¿Qué parte de ti todavía te da miedo mostrarme del todo?","¿Cuándo te sentiste más frágil conmigo, y cómo lo viví yo?","¿Qué necesitas oír para creer que te voy a quedar?","¿Qué te enseñó el amor que te dolió, y qué haces distinto conmigo?","¿Qué herida tuya sana, aunque sea un poco, a mi lado?"]},{"nombre":"SI PUDIERAS","cartas":["Si pudieras congelar nuestra edad, ¿en qué momento de la vida nos dejarías?","Si pudieras regalarme un día perfecto, ¿cómo sería de principio a fin?","Si pudieras borrarme un miedo, ¿cuál me quitarías?","Si pudieras que yo sintiera algo tuyo por un minuto, ¿qué elegirías?","Si pudieras pedir un deseo solo para nosotros, ¿cuál sería?"]},{"nombre":"CÓMO NOS CUIDAMOS","cartas":["¿Cómo te das cuenta de que te estoy cuidando, aunque no lo diga?","¿Qué te gustaría que yo cuide más de ti?","¿Qué haces tú por mí que crees que no noto?","¿Qué acuerdo nos haría cuidarnos mejor en los días difíciles?","¿Qué necesitas de mí para sentir que siempre estás primero?"]},{"nombre":"LO QUE NO CAMBIARÍA","cartas":["¿Qué defecto mío no cambiarías por nada?","¿Qué de nuestra historia repetirías igual, con lo bueno y lo malo?","¿Qué costumbre nuestra te hace sentir afortunado/a?","¿Qué de mí te sigue sorprendiendo después de todo este tiempo?","¿Qué crees que le falta a este amor… y qué le sobra de bueno?"]},{"nombre":"PREGUNTAS QUE NADIE HACE","cartas":["¿Qué crees que piensa la gente de nosotros que no es verdad?","¿En qué momento me perdonaste antes de que pidiera perdón?","¿Qué parte de amarme te ha costado más aprender?","¿ /* ═══════════════════════════════════════════════════════════════════
   RESPALDO EN CAPAS — por que existe cada capa
   ───────────────────────────────────────────────────────────────────
   La racha es lo unico que la pareja no puede perder. Sin servidor,
   ningun almacenamiento del navegador es eterno, asi que guardamos lo
   mismo en varios sitios que fallan por razones distintas:

   CAPA 1 · localStorage  -> el dia a dia. Rapido y sincrono. Se lo
            lleva "Borrar datos de navegacion" y el modo incognito.
   CAPA 2 · IndexedDB     -> segunda copia. Sobrevive a varios borrados
            que si vacian localStorage (algunos limpiadores de Android
            y varias opciones de "borrar cookies" solo tocan la capa 1),
            y el navegador la desaloja mas tarde cuando falta espacio.
   CAPA 3 · fusion al arrancar -> leemos las dos y nos quedamos con la
            racha MAS ALTA y con la union del historial. Si una capa se
            perdio o quedo vieja, la otra la resucita. Nunca bajamos.
   CAPA 4 · codigo de respaldo (SN-142-20260818-K7M2) -> texto corto,
            firmado, que el usuario se manda por WhatsApp. Es la unica
            capa que vive FUERA del navegador. Si cambian de celular o
            desinstalan el navegador entero, esto es lo unico que queda.
   CAPA 5 · recordatorio cada 7 dias para que guarden ese codigo.

   Honestidad: si desinstalan el navegador o cambian de telefono, sin
   servidor NO hay forma de que la racha sobreviva sola. Por eso la
   capa 4 existe y por eso insistimos con ella.

var CLAVE_LS  = 'sn_estado_v1';
var DB_NOMBRE = 'solo-nosotros', DB_STORE = 'respaldo', DB_LLAVE = 'estado';

/* ── fechas ─────────────────────────────────────────────────────── */
/* ?hoy=2026-08-20 fuerza la fecha. SOLO para pruebas automatizadas. */
function hoyISO(){
  var m = location.search.match(/[?&]hoy=(\d{4}-\d{2}-\d{2})/);
  if(m) return m[1];
  var d = new Date();
  return d.getFullYear() + '-' + dos(d.getMonth()+1) + '-' + dos(d.getDate());
}
function dos(n){ return (n<10?'0':'') + n; }
function aNum(iso){ /* dias absolutos desde 1970, sin zonas horarias */
  var p = iso.split('-');
  return Math.floor(Date.UTC(+p[0], +p[1]-1, +p[2]) / 86400000);
}
function difDias(a, b){ return aNum(b) - aNum(a); }
var MES = ['ene','feb','mar','abr','may','jun','jul','ago','set','oct','nov','dic'];
var DIA = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function bonita(iso){
  var p = iso.split('-');
  var d = new Date(Date.UTC(+p[0], +p[1]-1, +p[2]));
  return DIA[d.getUTCDay()] + ' ' + (+p[2]) + ' de ' + MES[+p[1]-1] + '.';
}
function corta(iso){
  var p = iso.split('-');
  return (+p[2]) + ' ' + MES[+p[1]-1] + ' ' + p[0];
}

/* ── estado en blanco ───────────────────────────────────────────── */
function nuevo(){
  return {v:1, nombres:['',''], racha:0, mejor:0, ultimo:'', hechos:{},
          hoy:null, premium:false, avisado:0, mazos:{}, mayor:false};
}

/* ── CAPA 1 · localStorage ──────────────────────────────────────── */
function leerLS(){
  try{
    var t = localStorage.getItem(CLAVE_LS);
    return t ? JSON.parse(t) : null;
  }catch(e){ return null; }
}
function guardarLS(e){
  try{ localStorage.setItem(CLAVE_LS, JSON.stringify(e)); }catch(err){}
}

/* ── CAPA 2 · IndexedDB ─────────────────────────────────────────── */
function abrirDB(cb){
  if(!window.indexedDB) return cb(null);
  var r;
  try{ r = indexedDB.open(DB_NOMBRE, 1); }catch(e){ return cb(null); }
  r.onupgradeneeded = function(){
    var db = r.result;
    if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
  };
  r.onsuccess = function(){ cb(r.result); };
  r.onerror   = function(){ cb(null); };
  r.onblocked = function(){ cb(null); };
}
function guardarDB(e){
  abrirDB(function(db){
    if(!db) return;
    try{
      var tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put(JSON.stringify(e), DB_LLAVE);
    }catch(err){}
  });
}
function leerDB(cb){
  abrirDB(function(db){
    if(!db) return cb(null);
    try{
      var tx = db.transaction(DB_STORE, 'readonly');
      var q  = tx.objectStore(DB_STORE).get(DB_LLAVE);
      q.onsuccess = function(){
        var v = q.result;
        try{ cb(v ? JSON.parse(v) : null); }catch(e){ cb(null); }
      };
      q.onerror = function(){ cb(null); };
    }catch(err){ cb(null); }
  });
}

/* guardar = escribir en las DOS capas, siempre */
function guardar(){
  guardarLS(est);
  guardarDB(est);
  if(window.__sn) window.__sn.estado = est;
}

/* ── CAPA 3 · fusion: nos quedamos con lo mejor de cada copia ────── */
function fusionar(a, b){
  if(!a && !b) return nuevo();
  if(!a) return sanear(b);
  if(!b) return sanear(a);
  a = sanear(a); b = sanear(b);
  var r = nuevo();
  /* la racha mas alta manda: si una copia se perdio, la otra resucita */
  r.racha   = Math.max(a.racha, b.racha);
  r.mejor   = Math.max(a.mejor, b.mejor, r.racha);
  r.ultimo  = (aNum(a.ultimo||'1970-01-01') >= aNum(b.ultimo||'1970-01-01')) ? a.ultimo : b.ultimo;
  r.premium = !!(a.premium || b.premium);
  r.avisado = Math.max(a.avisado, b.avisado);
  r.nombres = (a.nombres[0] || a.nombres[1]) ? a.nombres : b.nombres;
  var k;
  for(k in b.hechos) if(b.hechos.hasOwnProperty(k)) r.hechos[k] = b.hechos[k];
  for(k in a.hechos) if(a.hechos.hasOwnProperty(k)) r.hechos[k] = a.hechos[k];
  /* el progreso del dia en curso: el que tenga mas escrito */
  r.hoy = pesoHoy(a.hoy) >= pesoHoy(b.hoy) ? a.hoy : b.hoy;
  /* cartas vistas: la union de las dos copias, sin repetir */
  r.mayor = !!(a.mayor || b.mayor);
  r.mazos = {};
  var fuentes = [a.mazos || {}, b.mazos || {}], fi, mk;
  for(fi=0; fi<2; fi++){
    for(mk in fuentes[fi]) if(fuentes[fi].hasOwnProperty(mk)){
      if(!r.mazos[mk]) r.mazos[mk] = {vistas:[]};
      var vs = (fuentes[fi][mk] && fuentes[fi][mk].vistas) || [];
      for(var vi=0; vi<vs.length; vi++)
        if(r.mazos[mk].vistas.indexOf(vs[vi]) === -1) r.mazos[mk].vistas.push(vs[vi]);
    }
  }
  return r;
}
function pesoHoy(h){
  if(!h || h.fecha !== hoyISO()) return -1;
  return (h.a != null ? 1 : 0) + (h.b != null ? 1 : 0);
}
function sanear(e){
  var n = nuevo();
  if(!e || typeof e !== 'object') return n;
  n.racha   = Math.max(0, parseInt(e.racha, 10) || 0);
  n.mejor   = Math.max(n.racha, parseInt(e.mejor, 10) || 0);
  n.ultimo  = /^\d{4}-\d{2}-\d{2}$/.test(e.ultimo || '') ? e.ultimo : '';
  n.hechos  = (e.hechos && typeof e.hechos === 'object') ? e.hechos : {};
  n.hoy     = (e.hoy && typeof e.hoy === 'object') ? e.hoy : null;
  n.premium = !!e.premium;
  n.avisado = parseInt(e.avisado, 10) || 0;
  n.mazos   = (e.mazos && typeof e.mazos === 'object') ? e.mazos : {};
  n.mayor   = !!e.mayor;
  if(e.nombres && e.nombres.length === 2) n.nombres = [String(e.nombres[0]||''), String(e.nombres[1]||'')];
  return n;
}

function firma(racha, fecha){

  for(var i=0;i<s.length;i++){ h = (((h * 33) ^ s.charCodeAt(i)) >>> 0); }
  var out = '';
  for(var k=0;k<4;k++){ out += ABC.charAt(h % 32); h = Math.floor(h / 32); }
  return out;
}
function codigoRespaldo(){
  var f = est.ultimo || hoyISO();
  return 'SN-' + est.racha + '-' + f.replace(/-/g,'') + '-' + firma(est.racha, f);
}
function leerCodigo(txt){
  var t = String(txt||'').toUpperCase().replace(/\s+/g,'');
  var m = t.match(/^SN-(\d{1,5})-(\d{8})-([A-Z0-9]{4})$/);
  if(!m) return null;
  var racha = parseInt(m[1], 10);
  var f = m[2].slice(0,4) + '-' + m[2].slice(4,6) + '-' + m[2].slice(6,8);
  if(firma(racha, f) !== m[3]) return null;
  return {racha:racha, ultimo:f};
}

/* ── la racha ───────────────────────────────────────────────────── */
/* hoy=0 -> ya respondieron hoy | 1 -> viva | 2 -> en riesgo (un dia de
   gracia) | 3 o mas -> se reinicia. Un solo dia saltado NO la mata. */
function situacion(){
  if(!est.ultimo) return est.racha > 0 ? 'viva' : 'nueva';
  var d = difDias(est.ultimo, hoyISO());
  if(d <= 0) return 'hecho';
  if(d === 1) return 'viva';
  if(d === 2) return 'riesgo';
  return 'perdida';
}
function normalizar(){
  if(situacion() === 'perdida' && est.racha > 0) est.racha = 0;
  if(est.hoy && est.hoy.fecha !== hoyISO()) est.hoy = null;
}
function preguntaDeHoy(){
  var h = hoyISO();
  if(est.hechos[h]) return PREGUNTAS[(est.hechos[h].n - 1) % PREGUNTAS.length];
  if(est.hoy && est.hoy.fecha === h && est.hoy.n) return PREGUNTAS[(est.hoy.n - 1) % PREGUNTAS.length];
  var usadas = 0, k;
  for(k in est.hechos) if(est.hechos.hasOwnProperty(k)) usadas++;
  return PREGUNTAS[usadas % PREGUNTAS.length];
}
function completarDia(){
  var h = hoyISO(), s = situacion();
  if(s === 'viva' || s === 'riesgo') est.racha = est.racha + 1;
  else if(s !== 'hecho')             est.racha = 1;
  est.mejor  = Math.max(est.mejor, est.racha);
  est.ultimo = h;
  var q = preguntaDeHoy();
  est.hechos[h] = {n:q.n, p:q.pregunta, t:q.tema,
                   a:(est.hoy && est.hoy.a) || '', b:(est.hoy && est.hoy.b) || ''};
  est.hoy = null;
  guardar();
}
function tocaRecordar(){
  return est.racha > 0 && est.racha % 7 === 0 && est.avisado !== est.racha;
}

/* ── utilidades de pintado ──────────────────────────────────────── */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function nom(i){
  var n = est.nombres[i];
  return n ? n : (i === 0 ? 'Uno' : 'Dos');
}
function ir(p, extra){
  vista.p = p; vista.msg = null;
  if(extra) for(var k in extra) if(extra.hasOwnProperty(k)) vista[k] = extra[k];
  window.scrollTo(0,0);
  pintar();
}

/* ═══ los mazos: cuántas cartas, qué se vio y en qué orden ══════
   Sin membresía se abren las primeras GRATIS_POR_MAZO de cada mazo.
   Dentro del mazo las cartas salen BARAJADAS y no se repiten hasta
   que se acaben; lo visto queda guardado para retomar otro día.  */
var GRATIS_POR_MAZO = 3;
/* La edicion MINI es la muestra: entra COMPLETA sin pagar (30 cartas en 4
   mazos). Conexion y Sin Filtro se abren con el codigo de compra. */
var EDI_GRATIS = 'mini';
function ediLibre(e){ return !!e && e.id === EDI_GRATIS; }
function cartasDeEdicion(e){
  var n=0; for(var i=0;i<e.mazos.length;i++) n += e.mazos[i].cartas.length; return n;
}
var TOTAL_CARTAS = (function(){ var n=0; for(var i=0;i<EDICIONES.length;i++) n += cartasDeEdicion(EDICIONES[i]); return n; })();
function topeDe(m, e){
  if(est.premium || ediLibre(e)) return m.cartas.length;
  return Math.min(GRATIS_POR_MAZO, m.cartas.length);
}
function bonitoMazo(n){
  n = String(n||'').replace(/\s*\*\s*$/,'');
  return n.charAt(0) + n.slice(1).toLowerCase();
}
function claveProg(ei, mi){ return ei + ':' + mi; }
function leerProg(ei, mi){
  if(!est.mazos) est.mazos = {};
  var k = claveProg(ei,mi);
  if(!est.mazos[k]) est.mazos[k] = {vistas:[]};
  if(!est.mazos[k].vistas) est.mazos[k].vistas = [];
  return est.mazos[k];
}
/* saca una carta que todavía no hayan visto, al azar dentro del tope */
function sacarCarta(ei, mi){
  var m = EDICIONES[ei].mazos[mi], tope = topeDe(m, EDICIONES[ei]), prog = leerProg(ei,mi);
  var libres = [];
  for(var i=0;i<tope;i++) if(prog.vistas.indexOf(i) === -1) libres.push(i);
  if(!libres.length) return null;
  var elegida = libres[Math.floor(Math.random()*libres.length)];
  prog.vistas.push(elegida);
  guardar();
  return elegida;
}
function reiniciarMazo(ei, mi){ leerProg(ei,mi).vistas = []; guardar(); }
/* una carta al azar de toda la edición, sin repetir dentro de cada mazo */
function cartaSorpresa(ei){
  var e = EDICIONES[ei], orden = [];
  for(var i=0;i<e.mazos.length;i++) orden.push(i);
  for(var j=orden.length-1;j>0;j--){ var r=Math.floor(Math.random()*(j+1)); var t=orden[j]; orden[j]=orden[r]; orden[r]=t; }
  for(var k=0;k<orden.length;k++){
    var c = sacarCarta(ei, orden[k]);
    if(c !== null) return {mazo:orden[k], carta:c};
  }
  return null;
}
function volverBtn(txt){
  return '<button class="volver" data-ir="inicio">&#8592; ' + esc(txt||'Inicio') + '</button>';
}

      +  '<p>' + esc(m.cartas[vista.carta]) + '</p></div>';
  out += '<div class="cont">' + Math.min(prog.vistas.length, tope) + ' de ' + tope + '</div>';
  out += '<button class="bt" data-act="otra">Otra carta</button>';
  out += '<button class="bt chico suave" data-act="volver-edi">Terminar</button>';
  return out;
}

/* ═══ PANTALLA · nombres / ajustes ══════════════════════════════ */
function vNombres(dentro){
  var h = '';
  h += '<div class="card"><p class="eti">¿Cómo se llaman?</p>';
  h += '<p class="mini" style="margin-bottom:16px">Para saber de quién es cada respuesta.</p>';
  h += '<div class="campo-wrap"><label class="campo">El primero en responder</label>'
    +  '<input type="text" id="n1" value="' + esc(est.nombres[0]) + '" placeholder="Tu nombre"></div>';
  h += '<div class="campo-wrap"><label class="campo">El segundo</label>'
    +  '<input type="text" id="n2" value="' + esc(est.nombres[1]) + '" placeholder="Su nombre"></div>';
  h += '<button class="bt" data-act="nombres">' + (dentro ? 'Empezar' : 'Guardar') + '</button></div>';
  return h;
}
function vAjustes(){
  var out = volverBtn('Inicio');
  out += '<h1 style="font-size:30px;margin-bottom:18px">Opciones</h1>';
  out += vNombres(false);
  out += '<div class="card"><p class="eti gris">Membresía</p>'
      +  '<p class="mini">' + (est.premium
          ? 'Activa. Tienes los dos mazos completos.'
          : 'LITE. La pregunta del día es tuya gratis, para siempre. El mazo Sin Filtro completo es de la membresía.') + '</p>'
      +  (est.premium ? '' : '<button class="bt chico" data-act="pagar">Ver la membresía</button>') + '</div>';
  out += '<div class="card"><p class="eti gris">Récord</p>'
      +  '<p class="mini">Tu mejor racha: <b>' + est.mejor + ' días</b>.</p></div>';
  if(vista.msg) out += '<div class="' + (vista.msg.ok?'ok-msg':'mal-msg') + '">' + esc(vista.msg.t) + '</div>';
  return out;
}

/* ═══ pintado ═══════════════════════════════════════════════════ */
/* ═══ PANTALLA · el código de compra ════════════════════════════ */
function vCodigo(){
  var out = '<button class="volver" data-act="volver-edi">&#8592; Volver</button>';
  if(est.premium){
    out += '<div class="card hero"><p class="eti">Ya está abierto</p>'
      + '<h2 class="tit-gr">Tienen las ' + TOTAL_CARTAS + ' cartas.</h2>'
      + '<p class="mini" style="margin-top:12px">Las tres ediciones completas, en este celular, para siempre.</p>'
      + '<button class="bt" data-ir="inicio">Volver al inicio</button></div>';
    return out;
  }
  out += '<div class="card hero">'
    + '<p class="eti">Tu código</p>'
    + '<h2 class="tit-gr">' + TOTAL_CARTAS + ' cartas,<br>un solo pago.</h2>'
    + '<p class="mini" style="margin-top:12px">Escribe el código que te llegó con tu compra. '
    + 'Se escribe una sola vez y queda guardado en este celular.</p>'
    + '<input type="text" id="cod" placeholder="SN-XXXX-XX" autocomplete="off" spellcheck="false" '
    +   'autocapitalize="characters" style="text-align:center;letter-spacing:.14em;text-transform:uppercase;margin-top:14px">'
    + '<div id="cod-msg" class="mini" style="min-height:20px;margin-top:8px"></div>'
    + '<button class="bt" data-act="activar">Desbloquear</button></div>';
  out += '<p class="mini gris" style="text-align:center">La pregunta del día y las primeras '
    + GRATIS_POR_MAZO + ' cartas de cada mazo son gratis siempre.</p>';
  return out;
}
function _norm(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
function _hh(s){
  s = _norm(s);
  var h1 = 5381, h2 = 52711;
  for(var i=0;i<s.length;i++){
    var c = s.charCodeAt(i);
    h1 = (Math.imul(h1,33) + c) >>> 0;
    h2 = (Math.imul(h2,31) + c) >>> 0;
  }
  return h1.toString(16) + '-' + h2.toString(16);
}
function activarCodigo(){
  var i = document.getElementById('cod'), m = document.getElementById('cod-msg');
  var v = i ? i.value.replace(/^\s+|\s+$/g,'') : '';
  if(!m) return;
  if(!v){ m.style.color='#F0857D'; m.textContent='Escribe el código que te llegó con tu compra.'; return; }
  if(HASHES.indexOf(_hh(v)) > -1){
    est.premium = true; guardar();
    m.style.color='#7ED8A2'; m.textContent='Listo. Se abrieron las ' + TOTAL_CARTAS + ' cartas.';
    setTimeout(function(){ ir('inicio'); }, 850);
    return;
  }
  m.style.color='#F0857D';
  m.textContent='Ese código no es válido. Revísalo tal como te llegó, con los guiones.';
}

function pintar(){
  var app = document.getElementById('app'), h;
  if(vista.p === 'dia')            h = vDia();
  else if(vista.p === 'historial') h = vHistorial();
  else if(vista.p === 'respaldo')  h = vRespaldo();
  else if(vista.p === 'edicion')   h = vEdicion();
  else if(vista.p === 'codigo')    h = vCodigo();
  else if(vista.p === 'mazo')      h = vMazo();
  else if(vista.p === 'ajustes')   h = vAjustes();
  else if(vista.p === 'revela')    h = volverBtn('Inicio') + revelacion(est.hechos[hoyISO()], true);
  else                             h = vInicio();
  app.innerHTML = h;
  var ta = document.getElementById('ta');
  if(ta) ta.focus();
  if(window.__sn){ window.__sn.estado = est; window.__sn.vista = vista.p; }
}

/* ═══ eventos ═══════════════════════════════════════════════════ */
document.addEventListener('click', function(ev){
  var t = ev.target;
  while(t && t !== document.body && !t.getAttribute) t = t.parentNode;
  var b = t;
  while(b && b !== document.body && !(b.getAttribute('data-ir') || b.getAttribute('data-act') || b.getAttribute('data-mazo') || b.getAttribute('data-edi'))){
    b = b.parentNode;
  }
  if(!b || b === document.body) return;

  var destino = b.getAttribute('data-ir');
  if(destino){ vista.paso = 'intro'; ir(destino); return; }

  var mz = b.getAttribute('data-mazo');
  if(mz !== null && mz !== undefined && mz !== ''){ ir('mazo', {mazo:+mz, idx:0, paso:'intro'}); return; }

  var ed = b.getAttribute('data-edi');
  if(ed !== null && ed !== undefined && ed !== ''){ ir('edicion', {edi:+ed}); return; }

  var act = b.getAttribute('data-act');
  if(act === 'guardar-resp')  guardarResp(+b.getAttribute('data-quien'));
  else if(act === 'soy2')     { vista.paso = 'escribe2'; pintar(); }
  else if(act === 'nombres')  guardarNombres();
  else if(act === 'mayor')    { est.mayor = true; guardar(); pintar(); }
  else if(act === 'volver-edi'){ ir('edicion', {edi:vista.edi}); }
  else if(act === 'mazo-empezar'){ vista.paso='jugando'; vista.carta = sacarCarta(vista.edi, vista.mazo); pintar(); }
  else if(act === 'otra')     { vista.carta = sacarCarta(vista.edi, vista.mazo); pintar(); }
  else if(act === 'reiniciar'){ reiniciarMazo(vista.edi, vista.mazo); vista.paso='jugando';
                                vista.carta = sacarCarta(vista.edi, vista.mazo); pintar(); }
  else if(act === 'sorpresa') { var s = cartaSorpresa(vista.edi);
                                if(s){ ir('mazo', {mazo:s.mazo, carta:s.carta, paso:'jugando'}); }
                                else { vista.msg={ok:false,t:'Ya vieron todas las que tienen abiertas.'}; pintar(); } }
  else if(act === 'activar')  activarCodigo();
  else if(act === 'copiar')   copiar();
  else if(act === 'wa')       whatsapp();
  else if(act === 'recuperar')recuperar();
  else if(act === 'luego')    { est.avisado = est.racha; guardar(); pintar(); }
});

function guardarResp(quien){
  var ta = document.getElementById('ta');
  var v = ta ? ta.value.replace(/^\s+|\s+$/g,'') : '';
  if(!v){ if(ta){ ta.focus(); } return; }
  if(!est.hoy) est.hoy = {fecha:hoyISO(), n:preguntaDeHoy().n, a:null, b:null};
  if(quien === 0){
    est.hoy.a = v; guardar(); vista.paso = 'pasa'; pintar();
  }else{
    est.hoy.b = v;
    completarDia();
    ir('revela');
  }
}
function guardarNombres(){
  var a = document.getElementById('n1'), b = document.getElementById('n2');
  est.nombres = [a ? a.value.replace(/^\s+|\s+$/g,'').slice(0,18) : '',
                 b ? b.value.replace(/^\s+|\s+$/g,'').slice(0,18) : ''];
  guardar();
  if(vista.p === 'dia'){ vista.paso = 'escribe1'; pintar(); }
  else { vista.msg = {ok:true, t:'Listo, guardado.'}; pintar(); }
}
function textoWA(){
  return 'Mi racha de Solo Nosotros: ' + codigoRespaldo()
       + ' (' + est.racha + ' días). No borres este mensaje, con esto la recupero.';
}
function whatsapp(){
  var t = textoWA();
  if(navigator.share){
    try{ navigator.share({text:t}); return; }catch(e){}
  }
  window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank');
}
function copiar(){
  var c = codigoRespaldo();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(c);
  }
  vista.msg = {ok:true, t:'Código copiado: ' + c};
  pintar();
}
function recuperar(){
  var inp = document.getElementById('inp-cod');
  var r = leerCodigo(inp ? inp.value : '');
  if(!r){ vista.msg = {ok:false, t:'Ese código no es válido. Cópialo completo, tal cual.'}; pintar(); return; }
  if(r.racha <= est.racha && est.ultimo){
    vista.msg = {ok:true, t:'Tu racha actual (' + est.racha + ') ya es igual o mejor. No tocamos nada.'};
    pintar(); return;
  }
  est.racha  = r.racha;
  est.ultimo = r.ultimo;
  est.mejor  = Math.max(est.mejor, r.racha);
  guardar();
  vista.msg = {ok:true, t:'Recuperada: ' + r.racha + ' días seguidos.'};
  pintar();
}

/* ═══ arranque ══════════════════════════════════════════════════ */
/* ventana de pruebas: el robot que verifica el juego mira por aquí.
   No expone nada que sirva para saltarse el código: HASHES no sale. */
window.__sn = {estado:null, listo:false, vista:'',
  total:TOTAL_CARTAS, gratis:GRATIS_POR_MAZO,
  ediciones:function(){ return EDICIONES.map(function(e){
    return {id:e.id, nombre:e.nombre, adulto:!!e.adulto, mazos:e.mazos.length, cartas:cartasDeEdicion(e)}; }); },
  ir:function(p,x){ return ir(p,x); },
  tope:function(ei,mi){ return topeDe(EDICIONES[ei].mazos[mi], EDICIONES[ei]); },
  activar:function(){ return activarCodigo(); }};

function arrancar(){
  var a = leerLS();
  leerDB(function(b){
    est = fusionar(a, b);
    normalizar();
    guardar();                 /* deja las dos capas iguales y al dia */
    window.__sn.listo = true;
    pintar();
  });
}
arrancar();

/* service worker: red primero */
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
})();
