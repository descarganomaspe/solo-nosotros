<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:#0B0A0D;color:#F2EDEF;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;left:50%;top:-180px;width:520px;height:420px;
  transform:translateX(-50%);pointer-events:none;z-index:0;
  background:radial-gradient(closest-side,rgba(142,27,79,.42),rgba(142,27,79,0));
}
button,input,textarea{font-family:inherit;font-size:16px;color:inherit}
button{border:0;background:none;cursor:pointer}
h1,h2,h3{margin:0;line-height:1.15;font-weight:800;letter-spacing:-.5px}
p{margin:0 0 10px}
p:last-child{margin-bottom:0}
.oculto{display:none !important}

#app{position:relative;z-index:1;max-width:430px;margin:0 auto;
  padding:calc(14px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom))}

/* ── marca ────────────────────────────────────────────────────── */
#marca{display:flex;align-items:center;gap:9px;margin-bottom:22px}
#marca .pt{width:9px;height:9px;border-radius:99px;background:#E84C8A;
  box-shadow:0 0 12px rgba(232,76,138,.9)}
#marca b{font-size:13px;letter-spacing:2.6px;text-transform:uppercase;
  font-weight:700;color:rgba(242,237,239,.62)}

/* ── racha grande ─────────────────────────────────────────────── */
#racha{text-align:center;padding:6px 0 26px}
#racha .fuego{font-size:44px;line-height:1;filter:drop-shadow(0 0 18px rgba(232,76,138,.45))}
#racha .num{font-size:96px;font-weight:850;letter-spacing:-6px;line-height:.92;
  margin:6px 0 0;background:linear-gradient(180deg,#fff 20%,#E84C8A 130%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
#racha .dias{font-size:19px;font-weight:700;letter-spacing:-.2px;margin-top:2px}
#racha .desde{font-size:13.5px;color:rgba(242,237,239,.5);margin-top:7px}
#racha .estado{display:inline-block;margin-top:13px;font-size:12.5px;font-weight:700;
  letter-spacing:.4px;padding:7px 14px;border-radius:99px;
  background:rgba(232,76,138,.14);color:#F09CC0;border:1px solid rgba(232,76,138,.28)}
#racha .estado.riesgo{background:rgba(214,142,26,.16);color:#F0C067;border-color:rgba(214,142,26,.36)}
#racha .estado.nueva{background:rgba(255,255,255,.07);color:rgba(242,237,239,.72);border-color:rgba(255,255,255,.13)}

/* ── tarjetas ─────────────────────────────────────────────────── */
.card{background:#141118;border:1px solid rgba(255,255,255,.075);
  border-radius:24px;padding:22px;margin-bottom:14px}
.card.hero{background:linear-gradient(165deg,#2A0E1D 0%,#160A11 62%);
  border-color:rgba(232,76,138,.30);box-shadow:0 18px 46px rgba(0,0,0,.55)}
.eti{font-size:11.5px;font-weight:800;letter-spacing:2.2px;text-transform:uppercase;
  color:#E84C8A;margin:0 0 12px}
.eti.gris{color:rgba(242,237,239,.42)}
.preg{font-size:25px;font-weight:750;letter-spacing:-.7px;line-height:1.24;margin:0}
.mini{font-size:13.5px;color:rgba(242,237,239,.55);line-height:1.55}

/* ── botones ──────────────────────────────────────────────────── */
.bt{display:block;width:100%;border-radius:99px;padding:17px;font-size:16.5px;
  font-weight:750;letter-spacing:-.2px;background:#8E1B4F;color:#fff;
  box-shadow:0 10px 26px rgba(142,27,79,.42);margin-top:18px}
.bt:active{transform:translateY(1px)}
.bt.suave{background:rgba(255,255,255,.075);color:#F2EDEF;box-shadow:none;
  border:1px solid rgba(255,255,255,.11)}
.bt.chico{padding:13px;font-size:14.5px;margin-top:10px}
.bt[disabled]{opacity:.35;box-shadow:none}
.fila{display:flex;gap:10px}
.fila .bt{margin-top:14px}

/* ── mazos ────────────────────────────────────────────────────── */
.mazo{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:#141118;border:1px solid rgba(255,255,255,.075);
  border-radius:22px;padding:18px;margin-bottom:12px}
.mazo .em{font-size:30px;flex:0 0 auto}
.mazo b{display:block;font-size:18px;font-weight:780;letter-spacing:-.3px}
.mazo small{display:block;font-size:13px;color:rgba(242,237,239,.5);margin-top:3px}
.mazo .fl{margin-left:auto;color:rgba(242,237,239,.35);font-size:20px}
.candado{font-size:11px;font-weight:800;letter-spacing:.8px;color:#F0C067;
  background:rgba(214,142,26,.14);border-radius:99px;padding:3px 9px;margin-left:8px}

/* ── escribir ─────────────────────────────────────────────────── */
textarea{width:100%;min-height:150px;border-radius:20px;padding:17px;
  background:#0F0D12;border:1px solid rgba(255,255,255,.12);
  resize:none;line-height:1.55;font-size:16.5px;outline:none}
textarea:focus{border-color:rgba(232,76,138,.55)}
input[type=text]{width:100%;border-radius:16px;padding:15px 16px;background:#0F0D12;
  border:1px solid rgba(255,255,255,.12);outline:none}
input[type=text]:focus{border-color:rgba(232,76,138,.55)}
label.campo{display:block;font-size:12.5px;font-weight:700;letter-spacing:1.2px;
  text-transform:uppercase;color:rgba(242,237,239,.45);margin:0 0 7px}
.campo-wrap{margin-bottom:16px}

/* ── el pase de celular ───────────────────────────────────────── */
.pase{text-align:center;padding:46px 10px 30px}
.pase .ico{font-size:56px}
.pase h2{font-size:29px;margin:18px 0 10px}
.pase p{font-size:15.5px;color:rgba(242,237,239,.58);max-width:19rem;margin:0 auto}

/* ── revelacion ───────────────────────────────────────────────── */
.resp{background:#141118;border:1px solid rgba(255,255,255,.08);
  border-radius:22px;padding:19px;margin-bottom:12px;
  animation:aparece .5s cubic-bezier(.16,1,.3,1) both}
.resp:nth-child(2){animation-delay:.22s}
.resp .quien{font-size:12px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;
  color:#E84C8A;margin-bottom:9px}
.resp .txt{font-size:18px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
@keyframes aparece{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.subio{text-align:center;margin:22px 0 4px;animation:aparece .5s .5s both}
.subio .f{font-size:38px}
.subio b{display:block;font-size:22px;margin-top:6px}
.subio small{display:block;font-size:13.5px;color:rgba(242,237,239,.5);margin-top:5px}

/* ── historial ────────────────────────────────────────────────── */
.dia{background:#141118;border:1px solid rgba(255,255,255,.075);
  border-radius:20px;padding:17px 18px;margin-bottom:11px}
.dia .fecha{font-size:11.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;
  color:rgba(242,237,239,.4);margin-bottom:8px}
.dia .q{font-size:16.5px;font-weight:720;letter-spacing:-.3px;line-height:1.3}
.dia .cuerpo{margin-top:13px;padding-top:13px;border-top:1px solid rgba(255,255,255,.07)}
.dia .cuerpo .quien{font-size:11.5px;font-weight:800;letter-spacing:1.4px;
  text-transform:uppercase;color:#E84C8A;margin-bottom:4px}
.dia .cuerpo .txt{font-size:15px;line-height:1.5;color:rgba(242,237,239,.85);
  white-space:pre-wrap;word-break:break-word;margin-bottom:12px}
.dia .cuerpo .txt:last-child{margin-bottom:0}
.vacio{text-align:center;padding:52px 20px;color:rgba(242,237,239,.42);font-size:15px}

/* ── codigo de respaldo ───────────────────────────────────────── */
.codigo{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:19px;font-weight:700;letter-spacing:.4px;text-align:center;
  background:#0F0D12;border:1px dashed rgba(232,76,138,.45);border-radius:18px;
  padding:20px 8px;margin:4px 0 8px;white-space:nowrap;overflow-x:auto;color:#F09CC0}
.aviso{display:flex;gap:11px;align-items:flex-start;background:rgba(214,142,26,.10);
  border:1px solid rgba(214,142,26,.28);border-radius:18px;padding:15px 16px;margin-bottom:14px}
.aviso .i{font-size:18px;line-height:1.3}
.aviso p{font-size:13.5px;line-height:1.55;color:#EAD3A8}
.ok-msg{background:rgba(60,180,110,.12);border:1px solid rgba(60,180,110,.32);
  color:#9BE3BC;border-radius:16px;padding:13px 15px;font-size:14px;margin-top:12px}
.mal-msg{background:rgba(200,60,60,.12);border:1px solid rgba(200,60,60,.32);
  color:#F0A7A7;border-radius:16px;padding:13px 15px;font-size:14px;margin-top:12px}

/* ── barra de volver ──────────────────────────────────────────── */
.volver{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:650;
  color:rgba(242,237,239,.55);padding:4px 0 20px}
.pie{margin-top:26px;text-align:center}
.pie button{font-size:13.5px;color:rgba(242,237,239,.42);padding:9px;font-weight:600}
.sep{height:1px;background:rgba(255,255,255,.07);margin:26px 0 20px}

/* ═══════════════════════════════════════════════════════════════════
   RESPALDO EN CAPAS — por que existe cada capa
   ───────────────────────────────────────────────────────────────────
   La racha es lo unico que la pareja no puede perder. Sin servidor,
   ningun almacenamiento del navegador es eterno, asi que guardamos lo
   mismo en varios sitios que fallan por razones distintas:

   CAPA 1 · localStorage  -> el dia a dia. Rapido y sincrono. Se lo
            lleva "Borrar datos de navegacion" y el modo incognito.
   CAPA 2 · IndexedDB     -> segunda copia. Sobrevive a varios borrados
            que si vacian localStorage (algunos limpiadores de Android
            y varias opciones de "borrar cookies" solo tocan la capa 1),
            y el navegador la desaloja mas tarde cuando falta espacio.
   CAPA 3 · fusion al arrancar -> leemos las dos y nos quedamos con la
            racha MAS ALTA y con la union del historial. Si una capa se
            perdio o quedo vieja, la otra la resucita. Nunca bajamos.
   CAPA 4 · codigo de respaldo (SN-142-20260818-K7M2) -> texto corto,
            firmado, que el usuario se manda por WhatsApp. Es la unica
            capa que vive FUERA del navegador. Si cambian de celular o
            desinstalan el navegador entero, esto es lo unico que queda.
   CAPA 5 · recordatorio cada 7 dias para que guarden ese codigo.

   Honestidad: si desinstalan el navegador o cambian de telefono, sin
   servidor NO hay forma de que la racha sobreviva sola. Por eso la
   capa 4 existe y por eso insistimos con ella.
   ═════════════════════════════════════════════════════════════════ */

var CLAVE_LS  = 'sn_estado_v1';
var DB_NOMBRE = 'solo-nosotros', DB_STORE = 'respaldo', DB_LLAVE = 'estado';

var est = null;     /* estado vivo */
var vista = {p:'inicio', paso:'intro', mazo:null, idx:0, msg:null};

/* ── fechas ─────────────────────────────────────────────────────── */
/* ?hoy=2026-08-20 fuerza la fecha. SOLO para pruebas automatizadas. */
function hoyISO(){
  var m = location.search.match(/[?&]hoy=(\d{4}-\d{2}-\d{2})/);
  if(m) return m[1];
  var d = new Date();
  return d.getFullYear() + '-' + dos(d.getMonth()+1) + '-' + dos(d.getDate());
}
function dos(n){ return (n<10?'0':'') + n; }
function aNum(iso){ /* dias absolutos desde 1970, sin zonas horarias */
  var p = iso.split('-');
  return Math.floor(Date.UTC(+p[0], +p[1]-1, +p[2]) / 86400000);
}
function difDias(a, b){ return aNum(b) - aNum(a); }
var MES = ['ene','feb','mar','abr','may','jun','jul','ago','set','oct','nov','dic'];
var DIA = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function bonita(iso){
  var p = iso.split('-');
  var d = new Date(Date.UTC(+p[0], +p[1]-1, +p[2]));
  return DIA[d.getUTCDay()] + ' ' + (+p[2]) + ' de ' + MES[+p[1]-1] + '.';
}
function corta(iso){
  var p = iso.split('-');
  return (+p[2]) + ' ' + MES[+p[1]-1] + ' ' + p[0];
}

/* ── estado en blanco ───────────────────────────────────────────── */
function nuevo(){
  return {v:1, nombres:['',''], racha:0, mejor:0, ultimo:'', hechos:{},
          hoy:null, premium:false, avisado:0};
}

/* ── CAPA 1 · localStorage ──────────────────────────────────────── */
function leerLS(){
  try{
    var t = localStorage.getItem(CLAVE_LS);
    return t ? JSON.parse(t) : null;
  }catch(e){ return null; }
}
function guardarLS(e){
  try{ localStorage.setItem(CLAVE_LS, JSON.stringify(e)); }catch(err){}
}

/* ── CAPA 2 · IndexedDB ─────────────────────────────────────────── */
function abrirDB(cb){
  if(!window.indexedDB) return cb(null);
  var r;
  try{ r = indexedDB.open(DB_NOMBRE, 1); }catch(e){ return cb(null); }
  r.onupgradeneeded = function(){
    var db = r.result;
    if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
  };
  r.onsuccess = function(){ cb(r.result); };
  r.onerror   = function(){ cb(null); };
  r.onblocked = function(){ cb(null); };
}
function guardarDB(e){
  abrirDB(function(db){
    if(!db) return;
    try{
      var tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put(JSON.stringify(e), DB_LLAVE);
    }catch(err){}
  });
}
function leerDB(cb){
  abrirDB(function(db){
    if(!db) return cb(null);
    try{
      var tx = db.transaction(DB_STORE, 'readonly');
      var q  = tx.objectStore(DB_STORE).get(DB_LLAVE);
      q.onsuccess = function(){
        var v = q.result;
        try{ cb(v ? JSON.parse(v) : null); }catch(e){ cb(null); }
      };
      q.onerror = function(){ cb(null); };
    }catch(err){ cb(null); }
  });
}

/* guardar = escribir en las DOS capas, siempre */
function guardar(){
  guardarLS(est);
  guardarDB(est);
  if(window.__sn) window.__sn.estado = est;
}

/* ── CAPA 3 · fusion: nos quedamos con lo mejor de cada copia ────── */
function fusionar(a, b){
  if(!a && !b) return nuevo();
  if(!a) return sanear(b);
  if(!b) return sanear(a);
  a = sanear(a); b = sanear(b);
  var r = nuevo();
  /* la racha mas alta manda: si una copia se perdio, la otra resucita */
  r.racha   = Math.max(a.racha, b.racha);
  r.mejor   = Math.max(a.mejor, b.mejor, r.racha);
  r.ultimo  = (aNum(a.ultimo||'1970-01-01') >= aNum(b.ultimo||'1970-01-01')) ? a.ultimo : b.ultimo;
  r.premium = !!(a.premium || b.premium);
  r.avisado = Math.max(a.avisado, b.avisado);
  r.nombres = (a.nombres[0] || a.nombres[1]) ? a.nombres : b.nombres;
  var k;
  for(k in b.hechos) if(b.hechos.hasOwnProperty(k)) r.hechos[k] = b.hechos[k];
  for(k in a.hechos) if(a.hechos.hasOwnProperty(k)) r.hechos[k] = a.hechos[k];
  /* el progreso del dia en curso: el que tenga mas escrito */
  r.hoy = pesoHoy(a.hoy) >= pesoHoy(b.hoy) ? a.hoy : b.hoy;
  return r;
}
function pesoHoy(h){
  if(!h || h.fecha !== hoyISO()) return -1;
  return (h.a != null ? 1 : 0) + (h.b != null ? 1 : 0);
}
function sanear(e){
  var n = nuevo();
  if(!e || typeof e !== 'object') return n;
  n.racha   = Math.max(0, parseInt(e.racha, 10) || 0);
  n.mejor   = Math.max(n.racha, parseInt(e.mejor, 10) || 0);
  n.ultimo  = /^\d{4}-\d{2}-\d{2}$/.test(e.ultimo || '') ? e.ultimo : '';
  n.hechos  = (e.hechos && typeof e.hechos === 'object') ? e.hechos : {};
  n.hoy     = (e.hoy && typeof e.hoy === 'object') ? e.hoy : null;
  n.premium = !!e.premium;
  n.avisado = parseInt(e.avisado, 10) || 0;
  if(e.nombres && e.nombres.length === 2) n.nombres = [String(e.nombres[0]||''), String(e.nombres[1]||'')];
  return n;
}

/* ── CAPA 4 · codigo de respaldo firmado ────────────────────────── */
var ABC = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   /* sin I, O, 0, 1 */
function firma(racha, fecha){
  var s = 'SoloNosotros|' + racha + '|' + fecha;
  var h = 5381;
  for(var i=0;i<s.length;i++){ h = (((h * 33) ^ s.charCodeAt(i)) >>> 0); }
  var out = '';
  for(var k=0;k<4;k++){ out += ABC.charAt(h % 32); h = Math.floor(h / 32); }
  return out;
}
function codigoRespaldo(){
  var f = est.ultimo || hoyISO();
  return 'SN-' + est.racha + '-' + f.replace(/-/g,'') + '-' + firma(est.racha, f);
}
function leerCodigo(txt){
  var t = String(txt||'').toUpperCase().replace(/\s+/g,'');
  var m = t.match(/^SN-(\d{1,5})-(\d{8})-([A-Z0-9]{4})$/);
  if(!m) return null;
  var racha = parseInt(m[1], 10);
  var f = m[2].slice(0,4) + '-' + m[2].slice(4,6) + '-' + m[2].slice(6,8);
  if(firma(racha, f) !== m[3]) return null;
  return {racha:racha, ultimo:f};
}

/* ── la racha ───────────────────────────────────────────────────── */
/* hoy=0 -> ya respondieron hoy | 1 -> viva | 2 -> en riesgo (un dia de
   gracia) | 3 o mas -> se reinicia. Un solo dia saltado NO la mata. */
function situacion(){
  if(!est.ultimo) return est.racha > 0 ? 'viva' : 'nueva';
  var d = difDias(est.ultimo, hoyISO());
  if(d <= 0) return 'hecho';
  if(d === 1) return 'viva';
  if(d === 2) return 'riesgo';
  return 'perdida';
}
function normalizar(){
  if(situacion() === 'perdida' && est.racha > 0) est.racha = 0;
  if(est.hoy && est.hoy.fecha !== hoyISO()) est.hoy = null;
}
function preguntaDeHoy(){
  var h = hoyISO();
  if(est.hechos[h]) return PREGUNTAS[(est.hechos[h].n - 1) % PREGUNTAS.length];
  if(est.hoy && est.hoy.fecha === h && est.hoy.n) return PREGUNTAS[(est.hoy.n - 1) % PREGUNTAS.length];
  var usadas = 0, k;
  for(k in est.hechos) if(est.hechos.hasOwnProperty(k)) usadas++;
  return PREGUNTAS[usadas % PREGUNTAS.length];
}
function completarDia(){
  var h = hoyISO(), s = situacion();
  if(s === 'viva' || s === 'riesgo') est.racha = est.racha + 1;
  else if(s !== 'hecho')             est.racha = 1;
  est.mejor  = Math.max(est.mejor, est.racha);
  est.ultimo = h;
  var q = preguntaDeHoy();
  est.hechos[h] = {n:q.n, p:q.pregunta, t:q.tema,
                   a:(est.hoy && est.hoy.a) || '', b:(est.hoy && est.hoy.b) || ''};
  est.hoy = null;
  guardar();
}
function tocaRecordar(){
  return est.racha > 0 && est.racha % 7 === 0 && est.avisado !== est.racha;
}

/* ── utilidades de pintado ──────────────────────────────────────── */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function nom(i){
  var n = est.nombres[i];
  return n ? n : (i === 0 ? 'Uno' : 'Dos');
}
function ir(p, extra){
  vista.p = p; vista.msg = null;
  if(extra) for(var k in extra) if(extra.hasOwnProperty(k)) vista[k] = extra[k];
  window.scrollTo(0,0);
  pintar();
}
function volverBtn(txt){
  return '<button class="volver" data-ir="inicio">&#8592; ' + esc(txt||'Inicio') + '</button>';
}

  /* la pregunta del dia, antes que nada */
  var q = preguntaDeHoy();

  }else{

  }
  h += '</div>';

      + '<span class="em">' + m.emoji + '</span><span>'

      + '<small>' + esc(m.bajada) + '</small></span>'
      + '<span class="fl">&#8250;</span></button>';
  }

  h += '<div class="sep"></div>';

/* ═══ PANTALLA · la pregunta del dia ════════════════════════════ */
function vDia(){
  var h = hoyISO(), q = preguntaDeHoy();
  var out = volverBtn('Inicio');

  if(!est.nombres[0] && !est.nombres[1] && vista.paso === 'intro'){
    return out + vNombres(true);
  }
  if(est.hechos[h]) return out + revelacion(est.hechos[h], false);

  if(!est.hoy) est.hoy = {fecha:h, n:q.n, a:null, b:null};

  if(est.hoy.a == null){
    out += escribir(0, q);
  }else if(est.hoy.b == null && vista.paso !== 'escribe2'){
    out += '<div class="pase"><div class="ico">&#128241;</div>'
        +  '<h2>Pásale el celular<br>a ' + esc(nom(1)) + '</h2>'
        +  '<p>No va a ver lo que escribiste. Recién cuando responda, se revelan las dos juntas.</p>'
        +  '<button class="bt" data-act="soy2">Ya soy ' + esc(nom(1)) + '</button></div>';
  }else if(est.hoy.b == null){
    out += escribir(1, q);
  }else{
    out += revelacion(est.hechos[h] || {p:q.pregunta, a:est.hoy.a, b:est.hoy.b}, false);
  }
  return out;
}

function vHistorial(){
  var out = volverBtn('Inicio');
  out += '<h1 style="font-size:30px;margin-bottom:6px">Nuestro archivo</h1>';
  out += '<p class="mini" style="margin-bottom:20px">Todo lo que se han respondido, con su fecha.</p>';
  var fechas = [], k;
  for(k in est.hechos) if(est.hechos.hasOwnProperty(k)) fechas.push(k);
  fechas.sort(function(x,y){ return aNum(y) - aNum(x); });
  if(!fechas.length){
    return out + '<div class="vacio">Todavía no hay nada guardado.<br>'
               + 'Respondan la pregunta de hoy y aparece acá.</div>';
  }
  for(var i=0;i<fechas.length;i++){
    var d = est.hechos[fechas[i]];
    out += '<div class="dia">'
      + '<div class="fecha">' + esc(corta(fechas[i])) + ' &middot; día ' + d.n + '</div>'
      + '<div class="q">' + esc(d.p) + '</div>'
      + '<div class="cuerpo">'
      + '<div class="quien">' + esc(nom(0)) + '</div><div class="txt">' + esc(d.a) + '</div>'
      + '<div class="quien">' + esc(nom(1)) + '</div><div class="txt">' + esc(d.b) + '</div>'
      + '</div></div>';
  }
  return out;
}

function vMazo(){
  var m = MAZOS[vista.mazo];
  var tope = est.premium ? m.cartas.length : Math.min(m.gratis, m.cartas.length);
  var out = volverBtn('Inicio');
  out += '<p class="eti">' + m.emoji + ' ' + esc(m.nombre) + '</p>';
  if(vista.idx >= tope){
    out += '<div class="card hero"><p class="eti">Se acabó lo gratis</p>'
      +  '<p class="preg">Quedan ' + (m.cartas.length - tope) + ' cartas de ' + esc(m.nombre) + '.</p>'
      +  '<p class="mini" style="margin-top:14px">La pregunta del día es gratis siempre. '
      +  'El mazo ' + esc(m.nombre) + ' completo entra con la membresía.</p>'
      +  '<button class="bt" data-act="pagar">Desbloquear el mazo</button>'
      +  '<button class="bt chico suave" data-ir="inicio">Ahora no</button></div>';
    return out;
  }

  out += '<div class="cont">Carta ' + (vista.idx+1) + ' de ' + tope + '</div>';

/* ═══ pintado ═══════════════════════════════════════════════════ */
function pintar(){
  var app = document.getElementById('app'), h;
  if(vista.p === 'dia')            h = vDia();
  else if(vista.p === 'historial') h = vHistorial();
  else if(vista.p === 'respaldo')  h = vRespaldo();
  else if(vista.p === 'mazo')      h = vMazo();
  else if(vista.p === 'ajustes')   h = vAjustes();
  else if(vista.p === 'revela')    h = volverBtn('Inicio') + revelacion(est.hechos[hoyISO()], true);
  else                             h = vInicio();
  app.innerHTML = h;
  var ta = document.getElementById('ta');
  if(ta) ta.focus();
  if(window.__sn){ window.__sn.estado = est; window.__sn.vista = vista.p; }
}

/* ═══ eventos ═══════════════════════════════════════════════════ */
document.addEventListener('click', function(ev){
  var t = ev.target;
  while(t && t !== document.body && !t.getAttribute) t = t.parentNode;
  var b = t;
  while(b && b !== document.body && !(b.getAttribute('data-ir') || b.getAttribute('data-act') || b.getAttribute('data-mazo'))){
    b = b.parentNode;
  }
  if(!b || b === document.body) return;

  var destino = b.getAttribute('data-ir');
  if(destino){ vista.paso = 'intro'; ir(destino); return; }

  var mz = b.getAttribute('data-mazo');
  if(mz !== null && mz !== undefined && mz !== ''){ ir('mazo', {mazo:+mz, idx:0}); return; }

  var act = b.getAttribute('data-act');
  if(act === 'guardar-resp')  guardarResp(+b.getAttribute('data-quien'));
  else if(act === 'soy2')     { vista.paso = 'escribe2'; pintar(); }
  else if(act === 'nombres')  guardarNombres();
  else if(act === 'otra')     { vista.idx++; pintar(); }
  else if(act === 'pagar')    { vista.msg = null; est.premium = true; guardar();
                                alert('Membresía activada. Los dos mazos completos son suyos.'); ir('inicio'); }
  else if(act === 'copiar')   copiar();
  else if(act === 'wa')       whatsapp();
  else if(act === 'recuperar')recuperar();
  else if(act === 'luego')    { est.avisado = est.racha; guardar(); pintar(); }
});

function guardarResp(quien){
  var ta = document.getElementById('ta');
  var v = ta ? ta.value.replace(/^\s+|\s+$/g,'') : '';
  if(!v){ if(ta){ ta.focus(); } return; }
  if(!est.hoy) est.hoy = {fecha:hoyISO(), n:preguntaDeHoy().n, a:null, b:null};
  if(quien === 0){
    est.hoy.a = v; guardar(); vista.paso = 'pasa'; pintar();
  }else{
    est.hoy.b = v;
    completarDia();
    ir('revela');
  }
}
function guardarNombres(){
  var a = document.getElementById('n1'), b = document.getElementById('n2');
  est.nombres = [a ? a.value.replace(/^\s+|\s+$/g,'').slice(0,18) : '',
                 b ? b.value.replace(/^\s+|\s+$/g,'').slice(0,18) : ''];
  guardar();
  if(vista.p === 'dia'){ vista.paso = 'escribe1'; pintar(); }
  else { vista.msg = {ok:true, t:'Listo, guardado.'}; pintar(); }
}
function textoWA(){
  return 'Mi racha de Solo Nosotros: ' + codigoRespaldo()
       + ' (' + est.racha + ' días). No borres este mensaje, con esto la recupero.';
}
function whatsapp(){
  var t = textoWA();
  if(navigator.share){
    try{ navigator.share({text:t}); return; }catch(e){}
  }
  window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank');
}
function copiar(){
  var c = codigoRespaldo();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(c);
  }
  vista.msg = {ok:true, t:'Código copiado: ' + c};
  pintar();
}
function recuperar(){
  var inp = document.getElementById('inp-cod');
  var r = leerCodigo(inp ? inp.value : '');
  if(!r){ vista.msg = {ok:false, t:'Ese código no es válido. Cópialo completo, tal cual.'}; pintar(); return; }
  if(r.racha <= est.racha && est.ultimo){
    vista.msg = {ok:true, t:'Tu racha actual (' + est.racha + ') ya es igual o mejor. No tocamos nada.'};
    pintar(); return;
  }
  est.racha  = r.racha;
  est.ultimo = r.ultimo;
  est.mejor  = Math.max(est.mejor, r.racha);
  guardar();
  vista.msg = {ok:true, t:'Recuperada: ' + r.racha + ' días seguidos.'};
  pintar();
}

/* ─────────────────────────────────────────────────────────────────
   Instalar en la pantalla de inicio.
   Cada navegador lo hace distinto y iPhone no avisa nunca: por eso
   hay que detectar dónde estamos antes de decir nada.
   ───────────────────────────────────────────────────────────────── */
var INST = {evento:null, caso:'', listo:false};
var LS_INST = 'sn_inst';
var DIAS_SNOOZE = 5;

function _iq(id){ return document.getElementById(id); }

function instYaEsta(){
  try{
    if(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
    if(window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches) return true;
  }catch(e){}
  return window.navigator.standalone === true;
}

/* Qué navegador es. El orden importa: los navegadores de apps también
   dicen "Safari" o "Chrome" en su user agent, así que van primero. */
function instCaso(){
  var u = navigator.userAgent || '';
  var esIOS = /iphone|ipad|ipod/i.test(u) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if(/FBAN|FBAV|FB_IAB|Instagram|Line\/|MicroMessenger|TikTok|Snapchat/i.test(u)) return 'dentro';
  if(/WhatsApp/i.test(u)) return 'dentro';
  /* WhatsApp en Android abre en WebView: no tiene barra de direcciones ni menú de instalar */
  if(/\bwv\b/i.test(u) || (/Android/i.test(u) && /Version\/[\d.]+ Chrome/i.test(u))) return 'dentro';
  if(esIOS && /CriOS/i.test(u))  return 'ios-chrome';
  if(esIOS && /FxiOS|EdgiOS|OPT\//i.test(u)) return 'ios-otro';
  if(esIOS) return 'ios-safari';
  if(/Android/i.test(u)) return 'android';
  return 'escritorio';
}

function instPostergada(){
  try{
    var v = localStorage.getItem(LS_INST);
    if(!v) return false;
    if(v === 'si') return true;                       /* ya la instaló */
    var t = parseInt(v, 10);
    if(!t) return false;
    return (Date.now() - t) < DIAS_SNOOZE * 86400000;
  }catch(e){ return false; }
}

window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault(); INST.evento = e;
  if(!instPostergada()) setTimeout(function(){ ofrecerInstalar(); }, 2500);
  else instChip(true);
});

window.addEventListener('appinstalled', function(){
  try{ localStorage.setItem(LS_INST, 'si'); }catch(e){}
  instCerrar(); instChip(false);
});

function instChip(ver){
  var c = _iq('inst-chip'); if(!c) return;
  if(ver && !instYaEsta()) c.classList.add('on'); else c.classList.remove('on');
}

function instCerrar(){
  _iq('instalar').classList.remove('on');
  _iq('inst-cap').classList.remove('on');
  _iq('inst-flecha').classList.remove('on');
}

/* forzar = lo pidió el usuario tocando el chip, así que se muestra igual */
function ofrecerInstalar(forzar){
  if(instYaEsta()) return;
  if(!forzar && instPostergada()){ instChip(true); return; }
  var caso = INST.caso || (INST.caso = instCaso());
  var tx = _iq('inst-texto'), ps = _iq('inst-pasos'), si = _iq('inst-si'), fl = _iq('inst-flecha');
  ps.innerHTML = ''; si.style.display = ''; fl.classList.remove('on');
  _iq('instalar').classList.remove('apunta');

  if(INST.evento){
    tx.textContent = 'Queda con su propio ícono y se abre sin la barra del navegador.';
    si.textContent = 'Instalar';
  }
  else if(caso === 'ios-safari'){
    tx.textContent = 'En iPhone se agrega a mano, en dos pasos:';
    ps.innerHTML =
      '<li><span class="n">1</span><span>Toca <b>Compartir</b>, el cuadrito con la flecha hacia arriba que est&aacute; abajo al centro.</span></li>' +
      '<li><span class="n">2</span><span>Baja en esa lista y toca <b>A&ntilde;adir a pantalla de inicio</b>.</span></li>';
    si.textContent = 'Listo, ya la agregué';
    fl.classList.add('on');
    _iq('instalar').classList.add('apunta');   /* deja libre la franja de abajo */
  }
  else if(caso === 'ios-chrome'){
    tx.textContent = 'Estás en Chrome. Se agrega así:';
    ps.innerHTML =
      '<li><span class="n">1</span><span>Toca el bot&oacute;n <b>Compartir</b> (la flecha hacia arriba, arriba a la derecha).</span></li>' +
      '<li><span class="n">2</span><span>Elige <b>A&ntilde;adir a pantalla de inicio</b>.</span></li>' +
      '<li><span class="n">3</span><span>Si no aparece, abre esta p&aacute;gina en <b>Safari</b>: ah&iacute; siempre est&aacute;.</span></li>';
    si.textContent = 'Listo, ya la agregué';
  }
  else if(caso === 'ios-otro'){
    tx.innerHTML = 'Este navegador de iPhone no siempre deja instalar. Abre la página en <b>Safari</b> y ahí toca Compartir &rarr; Añadir a pantalla de inicio.';
    si.textContent = 'Copiar el enlace';
  }
  else if(caso === 'dentro'){
    tx.innerHTML = 'Est&aacute;s viendo esto <b>dentro de otra app</b> (WhatsApp, Instagram o similar). Desde ah&iacute; no se puede instalar: hay que abrirlo en el navegador.';
    ps.innerHTML =
      '<li><span class="n">1</span><span>Toca los <b>tres puntos</b> de arriba y elige <b>Abrir en Safari</b> o <b>Abrir en Chrome</b>.</span></li>' +
      '<li><span class="n">2</span><span>Si no ves esa opci&oacute;n, copia el enlace y p&eacute;galo en el navegador.</span></li>';
    si.textContent = 'Copiar el enlace';
  }
  else if(caso === 'android'){
    tx.textContent = 'Se agrega desde el menú del navegador:';
    ps.innerHTML =
      '<li><span class="n">1</span><span>Toca los <b>tres puntos</b> arriba a la derecha.</span></li>' +
      '<li><span class="n">2</span><span>Elige <b>Instalar aplicaci&oacute;n</b> o <b>A&ntilde;adir a pantalla de inicio</b>.</span></li>';
    si.textContent = 'Listo, ya la agregué';
  }
  else { instChip(false); return; }   /* escritorio: no molestamos */

  instChip(false);
  _iq('inst-cap').classList.add('on');
  _iq('instalar').classList.add('on');
}

function instalarNo(){
  instCerrar();
  try{ localStorage.setItem(LS_INST, String(Date.now())); }catch(e){}
  instChip(true);          /* queda el botón chiquito, para que no se pierda */
}

function instCopiar(){
  var url = location.href.split('#')[0];
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url); }
    else {
      var t = document.createElement('textarea');
      t.value = url; t.style.position='fixed'; t.style.opacity='0';
      document.body.appendChild(t); t.select(); document.execCommand('copy');
      document.body.removeChild(t);
    }
    _iq('inst-si').textContent = 'Enlace copiado \u2713';
  }catch(e){}
}

function instalarSi(){
  var caso = INST.caso;
  if(INST.evento){
    INST.evento.prompt();
    INST.evento.userChoice.then(function(r){
      if(r && r.outcome === 'accepted'){ try{ localStorage.setItem(LS_INST,'si'); }catch(e){} }
      INST.evento = null; instCerrar();
    });
    return;
  }
  if(caso === 'dentro' || caso === 'ios-otro'){ instCopiar(); return; }
  try{ localStorage.setItem(LS_INST,'si'); }catch(e){}
  instCerrar();
}

/* Arranque. iPhone y los navegadores de apps no avisan nada, así que la
   invitación sale sola un rato después de abrir: el tiempo suficiente para
   que la persona vea de qué se trata la app y no le parezca un pop-up. */
(function(){
  if(instYaEsta()) return;
  INST.caso = instCaso();
  if(INST.caso === 'escritorio') return;
  var espera = (INST.caso === 'dentro') ? 9000 : 4000;
  setTimeout(function(){
    if(INST.evento) return;                 /* Android ya se encargó */
    if(instPostergada()){ instChip(true); return; }
    ofrecerInstalar();
  }, espera);
})();
</script>
